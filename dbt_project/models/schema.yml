version: 2

sources:
  - name: main
    schema: raw
    tables:
      - name: raw_customers
      - name: raw_services
      - name: raw_pos_locations
      - name: raw_revenue
      - name: raw_delivery

models:
  # --- BRONZE ---
  - name: stg_customers
  - name: stg_services
  - name: stg_pos_locations
  - name: stg_revenue
  - name: stg_delivery

  # --- SILVER (Dims) ---
  - name: dim_customer
    description: "Silver: Dimension table for Customers"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_service
    description: "Silver: Dimension table for Services"
    columns:
      - name: service_id
        tests:
          - unique
          - not_null

  - name: dim_pos_location
    description: "Silver: Dimension table for POS Locations"
    columns:
      - name: pos_id
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Silver: Dimension table for Dates"
    columns:
      - name: date_id
        tests:
          - unique
          - not_null

  # --- SILVER (Facts) ---
  - name: fact_revenue
    description: "Silver: Fact table for Revenue"
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null

  - name: fact_delivery_remuneration
    description: "Silver: Fact table for Delivery Remuneration"
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
          
  # --- GOLD (Views) ---
  - name: gold_view_revenue
    description: "Gold: OBT View for Revenue Analytics"
  
  - name: gold_view_delivery
    description: "Gold: OBT View for Delivery Remuneration Analytics"
