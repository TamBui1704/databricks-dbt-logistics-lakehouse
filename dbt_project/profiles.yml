logistics_dbt:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: default
      threads: 4
      host: "{{ env_var('DATABRICKS_HOST', 'community.cloud.databricks.com') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"

